<!--
  关于页（2026-10-08 由 scroll-demo 演示小样转正，站长定）：滚动叙事介绍页。与演示版差异：①主题跟随（内联色值换语义变量）②common.js about 模块驱动（init/destroy，pjax 安全）
  布局铁律：圆环是唯一主角（居中偏侧，随幕左右交替），内容永远在环旁边的「注解位」，
  左右交替出现；注解卡带 1px 连线从环边缘画出，出现时机与环变形同步（环变形过 40% 滑入）。
  开场动画（进页一次 ~2.1s，滚动可打断）：环画圆 → 刻度 stagger → 叙事行逐行浮现 → 注解就位。
  幕结构不变：表盘（起源）→ 轨道（功能）→ 光圈（相册）→ 年轮（数据）→ 印章（尾声）。
  引擎：sticky 钉屏 + 幕内进度 0..1；rAF 批量 + 进度无变化不写；transform/opacity/stroke-dashoffset only。
  文案集中在 STORY_COPY。reduced-motion：全部直出终态。
  2026-10-08 深夜大改（站长定调：滚动叙事保留，观感大改而非移除；当天曾误改编辑式静态页已回退）：
  ①装配仪式 4.2s→2.1s（updateWatch 时间轴与 CSS delay 同步压缩）②自动展示改幕一「▶ 自动展示」按钮点播，
  不再开场后自动开跑抢滚轮（滚轮/触摸仍随时打断）③四幕总滚动 1800vh→1100vh④注解卡卡片化（纸卡+描边+
  圆角 var(--radius)+毛玻璃）+ 环后光晕 + 辉光细节（视觉大改层见 style 尾部）⑤--line 更名 --lineScale
  （原与 :root 颜色变量撞名——JS 每帧写数字进颜色变量，dat-end 的 border-top 一直是坏的，顺手修正）。
-->
<style>
  /* 主题跟随：变量值取自 site.css 语义变量（深浅/复古主题自动跟随；本页原内联色值全部退役）。
     --clay 用 --apple-primary（主题色），--paper 用 --apple-background（纸底/画布同源） */
  :root {
    --paper: var(--apple-background, #f7f5f0);
    --ink: var(--apple-foreground, #262220);
    --ink-soft: var(--apple-muted-foreground, #6f675e);
    --clay: var(--apple-primary, #b0532b);
    --clay-warm: var(--brand-400, #d98d5f);
    --line: color-mix(in srgb, var(--apple-foreground, #262220) 12%, transparent);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: 'DM Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    overflow-x: hidden;
  }

  /* ========= 全屏开场舞台（装配仪式的影院幕布，结束后淡出交棒） ========= */
  .intro-stage {
    position: fixed; inset: 0; z-index: 4; background: color-mix(in srgb, var(--apple-foreground) 92%, #000000);
    opacity: 1; transition: opacity 0.85s ease;
  }
  body:not(.intro) .intro-stage { opacity: 0; pointer-events: none; }
  .intro-title {
    position: fixed; z-index: 6; left: 50%; top: 79%; transform: translateX(-50%);
    color: var(--clay-warm); font-weight: 700;
    font-size: clamp(17px, 2.6vw, 27px); letter-spacing: 0.55em; text-indent: 0.55em;
    white-space: nowrap; opacity: 0; pointer-events: none;
    transition: opacity 0.6s ease, letter-spacing 1.4s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  body.intro .intro-title { opacity: 1; letter-spacing: 0.2em; }
  body:not(.intro) .intro-title { opacity: 0; letter-spacing: 0.32em; }
  /* 开场期间：环居中放大特写，注解卡/cue 全部让位 */
  body.intro .ring-fix {
    left: 50%; top: 46%;
    transform: translate(-50%, -50%);
    width: min(66vmin, 580px); height: min(66vmin, 580px);
  }
  body.intro .story-note, body.intro #act1 .cue { opacity: 0 !important; }

  /* ========= 居中恒定圆环（主角） ========= */
  .ring-fix {
    position: fixed; left: 50%; top: 50%; width: min(50vmin, 440px); height: min(50vmin, 440px);
    transform: translate(-50%, -50%); z-index: 5; pointer-events: none;
    transition: transform 0.9s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.5s,
      width 0.9s cubic-bezier(0.32, 0.72, 0, 1), height 0.9s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .ring-fix.seal { opacity: 0.5; left: 28%; top: 50%; width: min(30vmin, 240px); height: min(30vmin, 240px); }
  .ring-fix { color: var(--clay); } /* 纸底幕=陶土 */
  body.story-dark .ring-fix { color: var(--clay-warm); } /* 墨底幕=暖橙 */
  body.in-act1 .ring-fix { transform: translate(calc(-50% - 12vw), -50%); }   /* 偏左，注解在右 */
  body.in-act2 .ring-fix { transform: translate(calc(-50% + 12vw), -50%); }   /* 偏右，注解在左 */
  body.in-act3 .ring-fix { transform: translate(calc(-50% + 24vw), -50%); opacity: 0.22; } /* 让位照片 */
  body.in-act4 .ring-fix { transform: translate(calc(-50% + 8vw), -50%); }    /* 微偏右，注解在左 */
  .ring-fix svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .ring-fix .track { fill: none; stroke: currentColor; opacity: 0.16; stroke-width: 1.1; }
  /* 表圈微刻度：dashed 圆环模拟 60 道细刻度（零 JS 静态层） */
  .ring-fix .minring { fill: none; stroke: currentColor; opacity: 0.3; stroke-width: 1.6; stroke-dasharray: 0.5 4.443; }
  /* 内圈机芯层：反向慢转的虚线环 + 收束细环 */
  .ring-fix .inner-dash { fill: none; stroke: currentColor; opacity: 0.3; stroke-width: 0.8; stroke-dasharray: 1 5; }
  .ring-fix .inner-solid { fill: none; stroke: currentColor; opacity: 0.15; stroke-width: 0.6; }
  .ring-fix .arc-glow { fill: none; stroke: currentColor; stroke-width: 5; opacity: 0.18; stroke-linecap: round; }
  .ring-fix .arc { fill: none; stroke: url(#arcGrad); stroke-width: 1.8; stroke-linecap: round; }
  .ring-fix .tick { stroke: currentColor; stroke-width: 1.4; opacity: 0; transition: opacity 0.5s; }
  .ring-fix .tick.lit { opacity: 0.85; }
  .ring-fix .planet-dot { fill: currentColor; opacity: 0.35; }
  /* ── 机械表盘：指针/齿轮/摆轮/宝石 ── */
  .ring-fix .hand { stroke: currentColor; stroke-linecap: round; }
  .ring-fix .hand-h { stroke-width: 2.6; opacity: 0.92; }
  .ring-fix .hand-m { stroke-width: 1.7; opacity: 0.92; }
  .ring-fix .hand-s { stroke: var(--clay-warm); stroke-width: 0.9; opacity: 0.95; }
  .ring-fix .cap { fill: var(--clay); }
  .ring-fix .cap-core { fill: var(--paper); }
  .ring-fix .gear-teeth { fill: none; stroke: currentColor; stroke-width: 2.6; opacity: 0.5; }
  .ring-fix .gear-rim { fill: none; stroke: currentColor; stroke-width: 0.8; opacity: 0.6; }
  .ring-fix .gear-spoke { stroke: currentColor; stroke-width: 0.8; opacity: 0.5; }
  .ring-fix .gear-jewel { fill: #c0452c; opacity: 0.95; }
  .ring-fix .balance-rim { fill: none; stroke: currentColor; stroke-width: 1.1; opacity: 0.7; }
  .ring-fix .balance-spoke { stroke: currentColor; stroke-width: 0.7; opacity: 0.55; }
  #watchHands, #watchGears, #watchBalance { transition: opacity 0.5s; }
  body.in-act2 #watchHands { opacity: 0.3; }
  body.in-act3 #watchHands, body.in-act4 #watchHands { opacity: 0.12; }
  body.in-act3 #watchGears { opacity: 0.12; }
  body.in-act4 #watchGears { opacity: 0.45; }
  body.in-act3 #watchBalance { opacity: 0.1; }
  .ring-fix .planet-g text { font-size: 8.5px; text-anchor: middle; dominant-baseline: central;
    opacity: 0.62; transition: font-size 0.35s, opacity 0.35s, fill 0.35s; }
  .ring-fix .planet-g.on text { font-size: 10.5px; opacity: 1; fill: var(--clay-warm); }
  .ring-fix .planet-g.on circle { r: 6.4; opacity: 0.16; }
  #ringPlanets { opacity: 0; transition: opacity 0.55s; }
  body.in-act2 #ringPlanets { opacity: 1; }
  body.in-act3 #ringPlanets { opacity: 0.3; }
  body.auto-on #ringPlanets { opacity: 0 !important; } /* 自动展示经过表盘时不显示字符 */
  /* 粒子引擎画布：环内第一层（弧线之下），拖尾+滚动速度耦合 */
  .ring-canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.92; }
  body.intro .ring-canvas { animation: introFade 0.8s ease 1s both; }
  .ring-core {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px; text-align: center;
  }
  .ring-core .core-idx { font-size: clamp(15px, 2vw, 19px); font-weight: 700; letter-spacing: 0.22em;
    font-variant-numeric: tabular-nums; opacity: 0; }
  .ring-core .core-num { font-size: clamp(42px, 8.6vw, 82px); font-weight: 700;
    font-variant-numeric: tabular-nums; line-height: 1; opacity: 0; }
  .ring-core .core-lbl { font-size: clamp(11px, 1.5vw, 13px); letter-spacing: 0.3em; opacity: 0; }

  /* ========= 注解卡（内容在环旁边，左右交替） ========= */
  .story-note {
    position: fixed; top: 50%; z-index: 6; width: min(360px, 80vw);
    transform: translateY(-50%);
    opacity: 0; pointer-events: none;
  }
  body.in-act1 #note1, body.in-act2 #note2, body.in-act3 #note3, body.in-act4 #note4 { pointer-events: auto; }
  .story-note .nb-title { font-size: clamp(18px, 2.4vw, 26px); font-weight: 700; margin-bottom: 10px; }
  .story-note .nb-body { color: var(--ink-soft); font-size: clamp(12.5px, 1.5vw, 14.5px); line-height: 1.85; }
  .story-note .nb-body em { font-style: normal; color: var(--clay); font-weight: 600; }
  .story-note a { display: inline-block; margin-top: 12px; color: var(--clay); font-size: 13px;
    text-decoration: none; border-bottom: 1px solid rgba(176, 83, 43, 0.4); padding-bottom: 2px; }
  .story-note a:hover { border-bottom-color: var(--clay); }
  /* 连接线：从环边缘画向注解卡（scaleX 由进度驱动） */
  .story-note::before {
    content: ""; position: absolute; top: 50%; height: 1px;
    width: clamp(44px, 6vw, 92px); background: currentColor; opacity: 0.45;
  }
  #note1 { left: calc(38% + min(26vmin, 224px) + 30px); color: var(--clay-warm); }
  #note1::before { right: 100%; margin-right: 14px; transform: scaleX(var(--lineScale, 0)); transform-origin: right center; }
  #note1 .nb-body { color: var(--ink-soft); }
  #note2 { right: calc(38% + min(26vmin, 224px) + 30px); color: var(--clay); }
  #note2::before { left: 100%; margin-left: 14px; transform: scaleX(var(--lineScale, 0)); transform-origin: left center; }
  #note3 { left: auto; right: 5vw; width: min(300px, 60vw); color: var(--clay-warm); }
  #note3::before { right: 100%; margin-right: 14px; width: clamp(30px, 3.4vw, 60px);
    transform: scaleX(var(--lineScale, 0)); transform-origin: right center; }
  #note3 .nb-body { color: var(--ink-soft); }
  #note4 { right: calc(42% + min(26vmin, 224px) + 30px); color: var(--clay); }
  #note4::before { left: 100%; margin-left: 14px; transform: scaleX(var(--lineScale, 0)); transform-origin: left center; }

  /* ========= 引擎骨架 ========= */
  .act { position: relative; }
  .act .pin { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; }

  /* ========= 氛围散点层（学 animejs 的环境填充：装饰微元素随滚动视差漂移） ========= */
  .amb { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .amb span { position: absolute; display: block; color: var(--clay); opacity: 0.16; will-change: transform; }
  body.story-dark .amb span { color: var(--clay-warm); opacity: 0.22; }
  .amb .a-ring { border: 1.5px solid currentColor; border-radius: 50%; }
  .amb .a-dot { background: currentColor; border-radius: 50%; }
  .amb .a-sq { border: 1.5px solid currentColor; }
  .amb .a-cross { position: absolute; }
  .amb .a-cross::before, .amb .a-cross::after { content: ""; position: absolute; background: currentColor; }
  .amb .a-cross::before { left: 50%; top: 0; width: 1.5px; height: 100%; transform: translateX(-50%); }
  .amb .a-cross::after { top: 50%; left: 0; height: 1.5px; width: 100%; transform: translateY(-50%); }

  .rail { position: fixed; right: 22px; top: 50%; transform: translateY(-50%); z-index: 60;
    display: flex; flex-direction: column; gap: 10px; }
  .rail i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); transition: all .3s; }
  .rail i.on { background: var(--clay); height: 20px; border-radius: 4px; }
  @media (max-width: 640px) { .rail { display: none; } }

  /* ========= 幕一 · 表盘（起源，墨色） ========= */
  #act1 { height: 220vh; }
  #act1 .pin { background: var(--paper); color: var(--ink); }
  #note1 .nb-title { color: var(--ink); }
  .nar-lines .line {
    font-size: clamp(21px, 3.4vw, 36px); font-weight: 700; line-height: 1.6;
    opacity: 0; transform: translateY(26px); letter-spacing: 0.14em;
  }
  .nar-lines .line em { font-style: normal; color: var(--clay); }
  .nar-dim { opacity: 0; transform: translateY(14px); margin-top: 18px;
    color: var(--ink-soft); font-size: clamp(11.5px, 1.4vw, 13.5px); letter-spacing: 0.16em; }
  #act1 .cue { position: absolute; bottom: 4vh; left: 50%; transform: translateX(-50%);
    color: var(--ink-soft); font-size: 11px; letter-spacing: .3em; opacity: 0;
    display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #act1 .cue svg { width: 15px; height: 15px; }

  /* ========= 幕二 · 轨道（能做什么，暖纸） ========= */
  #act2 { height: 320vh; }
  #act2 .pin { background: var(--paper); }
  .fn-ch {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 9px; margin-right: 6px;
    background: rgba(176, 83, 43, 0.12); color: var(--clay);
    font-size: 15px; vertical-align: middle;
  }
  #note2 .nb-title { display: flex; align-items: center; }

  /* ========= 幕三 · 光圈（相册，影院黑） ========= */
  #act3 { height: 300vh; }
  #act3 .pin { background: color-mix(in srgb, var(--paper) 96%, var(--clay)); color: var(--ink); }
  /* 照片统计卡网格（样式对齐后台概览 .stats/.stat：白卡+描边+网格，摆在环旁） */
  .ph-grid {
    position: absolute; left: 6vw; top: 50%; transform: translateY(-50%);
    width: min(50vw, 800px);
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
  }
  .ph-card {
    background: var(--apple-card); border: 1px solid var(--line); border-radius: 14px;
    overflow: hidden; opacity: 0; transform: translateY(26px) scale(0.94);
    box-shadow: 0 18px 44px -22px rgba(38, 34, 32, 0.35);
  }
  .ph-card img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
  .ph-card .pc-lbl { font-size: 11.5px; color: var(--ink-soft); padding: 7px 10px 9px; letter-spacing: 0.08em; }
  .ph-empty { color: var(--apple-muted-foreground, #6f675e); font-size: 13.5px; letter-spacing: .1em; }
  .corner { position: absolute; width: 26px; height: 26px; opacity: 0; z-index: 6; }
  .corner i { position: absolute; background: var(--clay-warm); }
  .corner .h { width: 100%; height: 2px; }
  .corner .v { width: 2px; height: 100%; }
  .corner.tl { top: calc(50% - 16vw); left: 4.5vw; }  .corner.tl .h { top: 0; left: 0; } .corner.tl .v { top: 0; left: 0; }
  .corner.tr { top: calc(50% - 16vw); right: 41vw; }  .corner.tr .h { top: 0; right: 0; } .corner.tr .v { top: 0; right: 0; }
  .corner.bl { bottom: calc(50% - 16vw); left: 4.5vw; }.corner.bl .h { bottom: 0; left: 0; } .corner.bl .v { bottom: 0; left: 0; }
  .corner.br { bottom: calc(50% - 16vw); right: 41vw; }.corner.br .h { bottom: 0; right: 0; } .corner.br .v { bottom: 0; right: 0; }
  .ph-empty { color: var(--apple-muted-foreground, #6f675e); font-size: 13.5px; letter-spacing: .1em; }
  /* 幕三注解卡内的相册名行（随照片轮换更新） */
  .nb-album { margin-top: 14px; font-size: 12px; letter-spacing: 0.22em;
    color: var(--ink-soft); }
  .nb-album b { color: var(--ink); font-weight: 600; }
  .eyebrow-n { font-size: 11px; letter-spacing: 0.34em; color: var(--clay); font-weight: 700; margin-bottom: 10px; }

  /* ========= 幕四 · 年轮（数据，暖纸） ========= */
  #act4 { height: 260vh; }
  #act4 .pin { background: var(--paper); }
  .dat-mini { position: absolute; z-index: 6; bottom: 8vh; left: 0; right: 0;
    display: flex; justify-content: center; gap: clamp(10px, 2.4vw, 26px); flex-wrap: wrap; }
  .dat-mini span { font-size: clamp(10.5px, 1.3vw, 12.5px); color: var(--ink-soft); opacity: 0.45;
    letter-spacing: 0.12em; transition: opacity 0.3s, color 0.3s; }
  .dat-mini span.on { opacity: 1; color: var(--clay); font-weight: 600; }
  .dat-end { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line);
    opacity: 0; transform: translateY(10px); color: var(--ink-soft);
    font-size: 12px; letter-spacing: 0.2em; line-height: 1.8; }

  /* ========= 氛围点阵纹理（每个幕的钉屏底各铺一层 26px 点阵） ========= */
  #act2 .pin, #act4 .pin {
    background-image: radial-gradient(rgba(176, 83, 43, 0.07) 1px, transparent 1.4px);
    background-size: 26px 26px;
  }
  #act1 .pin, #act3 .pin {
    background-image: radial-gradient(rgba(217, 141, 95, 0.06) 1px, transparent 1.4px);
    background-size: 26px 26px;
  }

  /* ========= 自动展示提示 ========= */
  .auto-hint {
    position: fixed; z-index: 60; left: 50%; bottom: 3.2vh; transform: translateX(-50%);
    font-size: 11.5px; letter-spacing: 0.14em; color: var(--ink-soft);
    background: color-mix(in srgb, var(--paper) 82%, transparent);
    border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px;
    backdrop-filter: blur(6px); transition: opacity 0.4s;
  }
  .auto-hint[hidden] { display: none; }

  /* ========= 尾声：文字排在印章环旁边 ========= */
  .tail { min-height: 92vh; display: flex; align-items: center;
    padding: 0 6vw 0 46vw; text-align: left; }
  .tail h2 { color: var(--ink); font-size: clamp(20px, 3vw, 32px); margin-bottom: 14px; }
  .tail p { font-size: 14px; line-height: 2; }
  .ring-fix.seal { left: 22%; top: 50%; width: min(30vmin, 240px); height: min(30vmin, 240px); opacity: 0.55; }

  /* ========= 开场动画 v2「装配仪式」（body.intro 期间播，3.8s；结束摘类交给滚动 scrub） ========= */
  body.intro .ring-fix .arc, body.intro .ring-fix .arc-glow { animation: introDraw 0.9s cubic-bezier(0.3, 0.6, 0.2, 1) both; }
  body.intro .ring-fix .track { animation: introFade 0.4s ease both; }
  body.intro .ring-fix .minring { animation: introMin 0.8s ease both; }
  body.intro .ring-fix .tick { animation: introTick 0.4s ease both; animation-delay: calc(0.35s + var(--d, 0s)); }
  body.intro .eyebrow-n { animation: introFade 0.6s ease 1s both; }
  body.intro .nar-lines .line { animation: introLine 0.7s cubic-bezier(0.3, 0.6, 0.2, 1) both;
    animation-delay: calc(1.05s + var(--d, 0s)); }
  body.intro .nar-dim { animation: introFade 0.5s ease 1.5s both; }

      var now = new Date();
      var sec = now.getSeconds(), min = now.getMinutes() + sec / 60, hr = (now.getHours() % 12) + min / 60;
      handS.setAttribute('transform', 'rotate(' + (sec * 6).toFixed(1) + ' 50 50)');
      handM.setAttribute('transform', 'rotate(' + (min * 6).toFixed(1) + ' 50 50)');
      handH.setAttribute('transform', 'rotate(' + (hr * 30).toFixed(1) + ' 50 50)');
    })();
    buildPhotos();
  } else {
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.scrollTo(0, 0); // 叙事永远从顶部开始（刷新也不再恢复到半路）
    buildPhotos();
    document.body.classList.add('intro');
    buildStats();
    tm(endIntro, INTRO_MS);
    // 真实滚动意图才打断开场/自动展示（wheel/触摸/按键）；scroll 事件不算——刷新恢复滚动位置也会发 scroll
    function onIntent() {
      userIntent = true;
      endIntro();
      stopAuto();
    }
    on(window, 'wheel', onIntent, { passive: true });
    on(window, 'touchstart', onIntent, { passive: true });
    on(window, 'keydown', onIntent);
    on(window, 'scroll', onScroll, { passive: true });
    on(window, 'resize', function () { onScroll(); sizeParticles(); }, { passive: true });
    if (autoHintEl) autoHintEl.addEventListener('click', function () { startAuto(); }); // 点播入口
    frame();
    initParticles();
  }
  }

  function start() {
    if (running) return;
    running = true;
    boot();
  }
  function stop() {
    running = false;
    if (auto && auto.raf) cancelAnimationFrame(auto.raf); // 自动展示的 rAF 是自调度，单独取消
    for (var i = 0; i < cleanups.length; i++) { try { cleanups[i](); } catch (e) {} }
    cleanups.length = 0;
    // 状态复位：回页重开时从幕一重新演（开场只演一次的会话标记不设——每次进页都是完整体验）
    document.body.classList.remove('intro', 'story-dark', 'auto-on', 'in-act1', 'in-act2', 'in-act3', 'in-act4', 'reduced');
    ringFix.classList.remove('seal');
  }
  window.__aboutStory = { start: start, stop: stop };
})();
</script>
<script src="/assets/common.js"></script>
<script src="/assets/blog-player.js"></script>
