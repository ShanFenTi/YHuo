<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网络开小差了 - YHuo</title>
  <!-- 离线兜底页（Service Worker 导航请求断网时的回退，2026-09-09 PWA 批次）：
       自足单文件——内联样式、不引用任何站点资源，断网状态下也能原样打开；
       跟随 prefers-color-scheme 深浅色；底/面/文字取 site.css 同款色值 -->
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: #f8f7f4;
      color: #1b1c1e;
    }
    .card {
      width: 100%;
      max-width: 380px;
      text-align: center;
      background: #ffffff;
      border-radius: 20px;
      padding: 44px 32px 32px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }
    .card svg { display: block; margin: 0 auto 18px; }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 10px; }
    .desc { font-size: 14px; line-height: 1.7; color: #5f6166; margin-bottom: 24px; }
    .retry {
      appearance: none;
      border: none;
      cursor: pointer;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background: #b0532b;
      border-radius: 12px;
      padding: 10px 36px;
      transition: opacity 0.2s;
    }
    .retry:hover { opacity: 0.88; }
    .retry:active { opacity: 0.76; }
    .hint { margin-top: 22px; font-size: 12px; color: #8a8c91; }
    @media (prefers-color-scheme: dark) {
      body { background: #000000; color: #f4f4f5; }
      .card { background: #1b1c1e; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); }
      .desc { color: #a5a7ac; }
      .hint { color: #6e7075; }
    }
  </style>
</head>
<body>
  <main class="card">
    <!-- 断网小图形（内联 SVG，不引站点资源） -->
    <svg width="64" height="64" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <circle cx="32" cy="32" r="30" fill="#b0532b" opacity="0.12"/>
      <path d="M20 38a10 10 0 0 1 2.2-19.8A13 13 0 0 1 47 21.5 9 9 0 0 1 46 38H20z" fill="#b0532b"/>
      <path d="M14 50 50 14" stroke="#b0532b" stroke-width="4" stroke-linecap="round"/>
      <path d="M14 50 50 14" stroke="#f8f7f4" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <h1>网络开小差了</h1>
    <p class="desc">暂时连不上服务器。检查一下网络后再试试吧。</p>
    <button class="retry" id="retryBtn" type="button">重试</button>
    <p class="hint">已打开过的页面断网时仍可浏览</p>
  </main>
  <script>
    document.getElementById('retryBtn').addEventListener('click', function () {
      location.reload();
    });
  </script>
</body>
</html>
