<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="YHuo 站点公开状态页：数据库、对象存储、邮件服务、每日备份四项健康灯，60 秒自动刷新，不含任何用户数据。">
  <meta property="og:title" content="YHuo — 站点状态">
  <meta property="og:description" content="数据库 / 对象存储 / 邮件服务 / 每日备份四项健康灯。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://190963.xyz/status/">
  <meta property="og:image" content="https://190963.xyz/images/og-banner.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://190963.xyz/status/">
  <link rel="icon" type="image/png" href="/assets/icons/favicon.png">
  <title>YHuo — 站点状态</title>
  <!-- 独立自足页（同 offline.html 思路）：不进八页外壳体系、不进导航（避开坑 23 同步成本），
       入口 = 关于页「站点数据」卡底部链接 + sitemap。数据只来自公开的 /api/health（布尔 + 备份日期）。
       2026-10-08 复古主题批次接入：本页引入全站 site.css 并读取访客主题存档（localStorage accent/apple-theme），
       状态卡跟随用户选的主题（含四款复古皮肤）；本页内联样式只保留布局骨架，皮肤层全部交给 site.css ——
       复古结构性覆盖段（html[data-accent] 选择器）在本页同样生效。 -->
  <script>
    // 主题跟随：在 site.css 加载前把访客存档写到 <html>（与 common.js 首帧逻辑同口径，避免闪一次默认色）
    (function () {
      try {
        var a = localStorage.getItem('accent');
        if (a) document.documentElement.setAttribute('data-accent', a);
        var t = localStorage.getItem('apple-theme');
        if (t === 'dark' || (!t && matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/assets/site.css">
  <style>
    /* 布局骨架：颜色全部走 site.css 语义变量（--apple-* 映射自 --background/--card/--border 等），
       主题色/深浅/复古四款结构性覆盖段全部自动跟随；本页不再硬编码任何颜色 */
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
      /* 画布同源：浅/深光晕用 --glow-a/b（主题跟随，复古四款自动换年代色） */
      background: radial-gradient(ellipse 900px 480px at 50% -160px, color-mix(in srgb, var(--glow-a, #cc7442) 16%, transparent), transparent 70%), var(--apple-background, #f8f7f4);
      color: var(--apple-foreground, #1b1c1e);
      font-family: var(--font-sans, "DM Sans", "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif);
      -webkit-font-smoothing: antialiased;
    }
    html.dark body {
      background: radial-gradient(ellipse 900px 480px at 50% -160px, color-mix(in srgb, var(--glow-b, #e7a37c) 12%, transparent), transparent 70%), var(--apple-background, #000);
    }
    .card {
      width: 100%; max-width: 460px;
      background: var(--apple-card, #fff);
      border: 1px solid var(--apple-border, #e6e3da);
      border-radius: 18px;
      padding: 26px 26px 20px;
      box-shadow: var(--shadow-lg, 0 16px 40px -18px rgba(0, 0, 0, 0.10));
    }
    h1 { font-size: 20px; margin: 0 0 4px; color: var(--apple-foreground); }
    .sub { font-size: 13px; color: var(--apple-muted-foreground); margin: 0 0 18px; }
    .row {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 2px; border-top: 1px solid var(--apple-border);
    }
    .row:first-of-type { border-top: 0; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; background: var(--apple-muted); }
    .dot.ok { background: var(--success, #2f9e5f); box-shadow: 0 0 0 3px color-mix(in srgb, var(--success, #2f9e5f) 15%, transparent); }
    .dot.warn { background: #d9930d; box-shadow: 0 0 0 3px rgba(217, 147, 13, 0.15); }
    .dot.bad { background: var(--destructive, #d64545); box-shadow: 0 0 0 3px color-mix(in srgb, var(--destructive, #d64545) 15%, transparent); }
    .name { font-size: 14px; font-weight: 600; color: var(--apple-foreground); }
    .desc { font-size: 12px; color: var(--apple-muted-foreground); margin-top: 2px; }
    .state { margin-left: auto; font-size: 13px; color: var(--apple-muted-foreground); text-align: right; }
    .state.ok { color: var(--success, #27814e); }
    .state.warn { color: #a86f08; }
    .state.bad { color: var(--destructive, #b93a3a); }
    .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; font-size: 12px; color: var(--apple-muted-foreground); }
    .foot a { color: var(--apple-primary); text-decoration: none; }
    .foot a:hover { text-decoration: underline; }
    button.refresh {
      font: inherit; font-size: 12px; padding: 4px 12px; border-radius: 999px;
      border: 1px solid var(--apple-border); background: transparent; color: inherit; cursor: pointer;
      transition: background 0.2s;
    }
    button.refresh:hover { background: color-mix(in srgb, var(--apple-primary) 8%, transparent); }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

    /* 复古四款（2026-10-08）：健康灯圆点→方灯，卡片窗格化，与站内同语言。
      （site.css 的复古覆盖段选择器是 html[data-accent] 前缀，在本页同样生效；
        这里只补本页特有类的复古形态） */
    html[data-accent='win98'] .dot,
    html[data-accent='portal'] .dot,
    html[data-accent='crt'] .dot,
    html[data-accent='oldbook'] .dot {
      border-radius: 0;
    }
    html[data-accent='win98'] .card {
      border: 2px solid var(--apple-border);
      border-radius: 0;
      box-shadow: none;
      background: #ffffff;
    }
    html[data-accent='win98'].dark .card {
      background: var(--apple-card);
    }
    html[data-accent='win98'] h1::after {
      content: '';
      display: block;
      margin-top: 6px;
      height: 14px;
      background: linear-gradient(90deg, #000080 0%, #1084d0 100%);
    }
    html[data-accent='portal'] .card {
      border-radius: 0;
      box-shadow: none;
    }
    html[data-accent='crt'] .card {
      border-radius: 0;
      box-shadow: 0 0 18px rgba(51, 255, 102, 0.16);
    }
    html[data-accent='oldbook'] .card {
      border: 3px double #b89a6a;
      border-radius: 0;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>站点状态</h1>
    <p class="sub">YHuo（<a href="/" style="color:inherit;">190963.xyz</a>）核心服务健康灯 · 60 秒自动刷新</p>
    <div class="row"><span class="dot" id="d1"></span><div><p class="name">数据库</p><p class="desc">D1 · 存随笔 / 留言 / 签到 / 课表</p></div><span class="state" id="d1t">检查中…</span></div>
    <div class="row"><span class="dot" id="kv"></span><div><p class="name">对象存储</p><p class="desc">KV · 存媒体文件 / 头像 / 备份</p></div><span class="state" id="kvt">检查中…</span></div>
    <div class="row"><span class="dot" id="mail"></span><div><p class="name">邮件服务</p><p class="desc">验证码 / 课表提醒的发信通道</p></div><span class="state" id="mailt">检查中…</span></div>
    <div class="row"><span class="dot" id="bak"></span><div><p class="name">每日备份</p><p class="desc">四张业务表全量 JSON · 保留 7 份</p></div><span class="state" id="bakt">检查中…</span></div>
    <div class="foot">
      <a href="/">← 返回首页</a>
      <span style="display:flex;align-items:center;gap:10px;"><span id="checkedAt"></span><button class="refresh" id="btnRefresh" type="button">立即刷新</button></span>
    </div>
  </main>
  <script>
    (function () {
      // 北京时间当天（YYYY-MM-DD）：备份日期口径与 tick/签到一致
      function bjToday() {
        var d = new Date(Date.now() + 8 * 3600 * 1000);
        return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
      }
      function daysAgo(dateStr) {
        var a = new Date(bjToday() + 'T00:00:00Z') - new Date(dateStr + 'T00:00:00Z');
        return Math.round(a / 86400000);
      }
      function set(id, cls, text) {
        var dot = document.getElementById(id);
        dot.className = 'dot ' + (cls || '');
        var t = document.getElementById(id + 't');
        t.className = 'state ' + (cls || '');
        t.textContent = text;
      }
      function check() {
        ['d1', 'kv', 'mail', 'bak'].forEach(function (id) { set(id, '', '检查中…'); });
        fetch('/api/health', { credentials: 'same-origin', cache: 'no-store' })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            // 数据库：绑定且可查询 = 正常（空库 tablesReady:false 属正常——09-20 起 health 只读化，
            // 不再顺手建表，建表由各业务接口首次访问负责，全新部署不该被误报红灯）
            if (d.db && d.dbReadable) set('d1', 'ok', d.tablesReady ? '正常' : '正常（待初始化）');
            else if (d.db) set('d1', 'bad', '异常');
            else set('d1', 'bad', '未绑定');
            // KV：绑定且可列 = 正常；绑定了但读不了 = 异常；没绑定 = 异常
            if (d.media && d.mediaOk) set('kv', 'ok', '正常');
            else if (d.media) set('kv', 'bad', '异常');
            else set('kv', 'bad', '未绑定');
            // 邮件：开 = 正常；关 = 站长自选的未启用（灰，不算故障）
            if (d.mail) set('mail', 'ok', '已启用');
            else set('mail', '', '未启用');
            // 备份：今天或昨天有 = 正常；再往后 = 偏旧（黄）；没有 = 未生成（灰）
            if (d.backupLastDate) {
              var n = daysAgo(d.backupLastDate);
              if (n <= 1) set('bak', 'ok', d.backupLastDate);
              else if (n <= 3) set('bak', 'warn', d.backupLastDate + '（' + n + ' 天前）');
              else set('bak', 'bad', d.backupLastDate + '（' + n + ' 天前）');
            } else set('bak', '', '未生成');
            document.getElementById('checkedAt').textContent = '检查于 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
          })
          .catch(function () {
            ['d1', 'kv', 'mail', 'bak'].forEach(function (id) { set(id, 'bad', '检测失败'); });
            document.getElementById('checkedAt').textContent = '网络异常，稍后自动重试';
          });
      }
      document.getElementById('btnRefresh').addEventListener('click', check);
      check();
      setInterval(check, 60000);
    })();
  </script>
</body>
</html>
